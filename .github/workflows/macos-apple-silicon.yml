  build-windows-arm64:
    name: Build Windows ARM64 nightly
    runs-on: windows-11-arm

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: develop

      - *extract-version-step
      - &extract-sqlite-version-step
        name: Extract SQLite version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $sqliteJdbcVersion = $pom.project.properties.'sqlite-jdbc.version'
          if (-not $sqliteJdbcVersion) {
            throw "Could not read sqlite-jdbc.version from pom.xml"
          }

          $sqliteVersion = $sqliteJdbcVersion -replace '\.\d+$', ''
          Write-Host "Extracted sqlite-jdbc version: $sqliteJdbcVersion"
          Write-Host "Derived SQLite version: $sqliteVersion"
          "SQLITE_JDBC_VERSION=$sqliteJdbcVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE_VERSION=$sqliteVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java 25 (Liberica) & cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '25'
          java-package: jdk
      - name: Restore Maven repository cache
        id: maven-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-java25-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-java25-maven-

      - name: Cache install4j
        uses: actions/cache@v5
        with:
          path: download/install4j
          key: install4j-windows-arm64-${{ env.INSTALL4J_VERSION }}
          restore-keys: install4j-windows-arm64-

      - name: Restore install4j JRE bundle cache
        id: cache-install4j-jres
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\install4j\${{ env.INSTALL4J_CACHE_VERSION }}\cached_jres
          key: install4j-jres-${{ runner.os }}-arm64-${{ env.INSTALL4J_VERSION }}-${{ hashFiles('installers/windows-aarch64/*.install4j') }}
          restore-keys: |
            install4j-jres-${{ runner.os }}-arm64-${{ env.INSTALL4J_VERSION }}-
            install4j-jres-${{ runner.os }}-arm64-

      - name: Download or reuse install4j.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path download -Force | Out-Null
          if (Test-Path download\install4j) {
            Write-Host "✔︎ Cached install4j"
          } else {
            Write-Host "→ Downloading install4j $env:INSTALL4J_VERSION for Windows"
            curl.exe -L `
              "https://download.ej-technologies.com/install4j/install4j_windows-arm64_${env:INSTALL4J_VERSION}.zip" `
              -o download/install4j.zip
            Expand-Archive download/install4j.zip -DestinationPath download
            # rename the extracted folder to 'install4j'
            $folder = Get-ChildItem download -Directory | Where-Object Name -like 'install4j*' | Select-Object -First 1
            Rename-Item -Path $folder.FullName -NewName 'install4j'
          }

      - name: Install install4j
        run: |
          echo "${{ github.workspace }}\download\install4j\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Restore cached Windows ARM64 ffmpeg bundle
        id: cache-win-arm64-ffmpeg
        uses: actions/cache@v5
        with:
          path: download\windows-bin-arm64
          key: ffmpeg-${{ runner.os }}-arm64-${{ env.WINDOWS_ARM64_FFMPEG_MD5 }}

      - name: Restore or download Windows ARM64 ffmpeg bundle
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "download\windows-bin-arm64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "download\windows-arm64-ffmpeg.zip"
          $targetDir = Join-Path $env:GITHUB_WORKSPACE "target\res\bin"

          if (-not (Test-Path (Join-Path $bundleDir "ffmpeg.exe"))) {
            Remove-Item $bundleDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

            Write-Host "→ Downloading $env:WINDOWS_ARM64_FFMPEG_URL"
            curl.exe -L $env:WINDOWS_ARM64_FFMPEG_URL -o $zipPath --progress-bar
            $actualMd5 = (Get-FileHash $zipPath -Algorithm MD5).Hash.ToLowerInvariant()
            if ($actualMd5 -ne $env:WINDOWS_ARM64_FFMPEG_MD5.ToLowerInvariant()) {
              throw "Windows ARM64 ffmpeg zip MD5 mismatch: got $actualMd5 expected $env:WINDOWS_ARM64_FFMPEG_MD5"
            }
            Expand-Archive -Path $zipPath -DestinationPath $bundleDir -Force

            $inner = Join-Path $bundleDir "ffmpeg"
            if (Test-Path $inner) {
              Get-ChildItem $inner -Force | Move-Item -Destination $bundleDir -Force
              Remove-Item $inner -Recurse -Force
            }

            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "✔︎ Cached Windows ARM64 ffmpeg bundle"
          }

          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path (Join-Path $bundleDir "*") -Destination $targetDir -Recurse -Force

      - name: Restore cached sqlite3 ARM64
        id: cache-sqlite-arm64
        uses: actions/cache@v5
        with:
          path: target\res\bin\sqlite3.exe
          key: sqlite3-${{ runner.os }}-arm64-${{ env.SQLITE_VERSION }}

      - name: Build sqlite3 ARM64
        if: steps.cache-sqlite-arm64.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sqliteVersion = $env:SQLITE_VERSION
          $versionParts = $sqliteVersion.Split('.')
          if ($versionParts.Count -ne 3) {
            throw "Unexpected SQLite version format: $sqliteVersion"
          }

          $sqliteEncodedVersion = "{0}{1:D2}{2:D2}00" -f `
            [int]$versionParts[0], `
            [int]$versionParts[1], `
            [int]$versionParts[2]

          $downloadPage = Invoke-WebRequest -Uri "https://sqlite.org/download.html"
          $relativeAmalgamationUrl = [regex]::Match(
            $downloadPage.Content,
            "(?<path>\d{4}/sqlite-amalgamation-$sqliteEncodedVersion\.zip)"
          ).Groups["path"].Value
          if (-not $relativeAmalgamationUrl) {
            throw "Could not find sqlite-amalgamation-$sqliteEncodedVersion.zip on sqlite.org/download.html"
          }

          $sqliteAmalgamationUrl = "https://sqlite.org/$relativeAmalgamationUrl"
          $sqliteRoot = Join-Path $env:GITHUB_WORKSPACE "download\sqlite-arm64"
          $sqliteAmalgamationZip = Join-Path $sqliteRoot "sqlite-amalgamation.zip"
          $sqliteOutDir = Join-Path $env:GITHUB_WORKSPACE "target\res\bin"

          New-Item -ItemType Directory -Path $sqliteRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $sqliteOutDir -Force | Out-Null

          Write-Host "→ Downloading $sqliteAmalgamationUrl"
          curl.exe -L $sqliteAmalgamationUrl -o $sqliteAmalgamationZip --progress-bar

          $sqliteAmalgamationDir = Join-Path $sqliteRoot "amalgamation"
          Expand-Archive -Path $sqliteAmalgamationZip -DestinationPath $sqliteAmalgamationDir -Force

          $sqliteAmalgamationSourceDir = Get-ChildItem $sqliteAmalgamationDir -Directory | Where-Object Name -like 'sqlite-amalgamation-*' | Select-Object -First 1
          if (-not $sqliteAmalgamationSourceDir) {
            throw "Could not locate extracted SQLite amalgamation directory"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsInstallPath) {
            throw "Could not find a Visual Studio installation"
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "Could not find VsDevCmd.bat at $vsDevCmd"
          }

          $sqliteExe = Join-Path $sqliteOutDir "sqlite3.exe"
          Push-Location $sqliteAmalgamationSourceDir.FullName
          try {
            $compileCmd = @(
              "`"$vsDevCmd`" -arch=arm64 -host_arch=arm64",
              "&&",
              "cl",
              "/nologo",
              "/O2",
              "/MT",
              "/DSQLITE_THREADSAFE=1",
              "/DSQLITE_ENABLE_DBPAGE_VTAB",
              "/Fe:`"$sqliteExe`"",
              "`"$($sqliteAmalgamationSourceDir.FullName)\shell.c`"",
              "`"$($sqliteAmalgamationSourceDir.FullName)\sqlite3.c`""
            ) -join ' '
            cmd.exe /c $compileCmd
            if ($LASTEXITCODE -ne 0) {
              throw "sqlite3 ARM64 compilation failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $sqliteExe)) {
            throw "Expected sqlite3.exe at $sqliteExe"
          }

      - name: Build Windows ARM64 app
        run: mvn -B package -P windows-aarch64,install4j-win-aarch64 -DskipTests

      - name: Upload to S3
        env:
          S3_ENDPOINT: ${{ secrets.MVS3_ENDPOINT }}
          S3_BUCKET:   ${{ secrets.MVS3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MVS3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MVS3_SECRET_ACCESS_KEY }}
        shell: pwsh
        run: |
          $date     = Get-Date -Format yyyy-MM-dd
          $endpoint = "https://$env:S3_ENDPOINT"
          $bucket   = $env:S3_BUCKET
          $version  = $env:MV_VERSION
      
          $exeName = "MediathekView-$version-win-arm64-$date.exe"
          $zipName = "MediathekView-$version-win-arm64-$date.zip"

          # Files in target/media Directory
          ls target\media\ | Format-Table
      
          # SHA512 generieren
          Get-FileHash target\media\MediathekView-latest-win-arm64.exe -Algorithm SHA512 | Select-Object -ExpandProperty Hash | Out-File -Encoding ASCII "target\media\$exeName.sha512"
          Get-FileHash target\media\MediathekView-latest-win-arm64.zip -Algorithm SHA512 | Select-Object -ExpandProperty Hash | Out-File -Encoding ASCII "target\media\$zipName.sha512"

          # Upload update manifest xml
          aws --endpoint-url $endpoint s3 cp target\media\updates.xml "s3://$bucket/updates-win-arm.xml"

          # Upload .exe
          aws --endpoint-url $endpoint s3 cp target\media\MediathekView-latest-win-arm64.exe "s3://$bucket/$exeName"
          aws --endpoint-url $endpoint s3 cp "target\media\$exeName.sha512" "s3://$bucket/$exeName.sha512"
      
          # Upload .zip
          aws --endpoint-url $endpoint s3 cp target\media\MediathekView-latest-win-arm64.zip "s3://$bucket/$zipName"
          aws --endpoint-url $endpoint s3 cp "target\media\$zipName.sha512" "s3://$bucket/$zipName.sha512"

  build-windows-amd64:
    name: Build Windows AMD64 nightly
    runs-on: windows-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: develop

      - *extract-version-step
      - *extract-sqlite-version-step

      - name: Set up Java 25 (Liberica) & cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '25'
          java-package: jdk
      - name: Restore Maven repository cache
        id: maven-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-java25-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-java25-maven-

      - name: Cache install4j
        uses: actions/cache@v5
        with:
          path: download/install4j
          key: install4j-windows-amd64-${{ env.INSTALL4J_VERSION }}
          restore-keys: install4j-windows-amd64-

      - name: Restore install4j JRE bundle cache
        id: cache-install4j-jres
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\install4j\${{ env.INSTALL4J_CACHE_VERSION }}\cached_jres
          key: install4j-jres-${{ runner.os }}-x64-${{ env.INSTALL4J_VERSION }}-${{ hashFiles('installers/windows-amd64/*.install4j') }}
          restore-keys: |
            install4j-jres-${{ runner.os }}-x64-${{ env.INSTALL4J_VERSION }}-
            install4j-jres-${{ runner.os }}-x64-

      - name: Download or reuse install4j.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path download -Force | Out-Null
          if (Test-Path download\install4j) {
            Write-Host "✔︎ Cached install4j"
          } else {
            Write-Host "→ Downloading install4j $env:INSTALL4J_VERSION for Windows"
            curl.exe -L `
              "https://download.ej-technologies.com/install4j/install4j_windows-x64_${env:INSTALL4J_VERSION}.zip" `
              -o download/install4j.zip
            Expand-Archive download/install4j.zip -DestinationPath download
            # rename the extracted folder to 'install4j'
            $folder = Get-ChildItem download -Directory | Where-Object Name -like 'install4j*' | Select-Object -First 1
            Rename-Item -Path $folder.FullName -NewName 'install4j'
          }

      - name: Install install4j
        run: |
          echo "${{ github.workspace }}\download\install4j\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Restore cached Windows AMD64 ffmpeg bundle
        id: cache-win-amd64-ffmpeg
        uses: actions/cache@v5
        with:
          path: download\windows-bin-amd64
          key: ffmpeg-${{ runner.os }}-amd64-${{ env.WINDOWS_AMD64_FFMPEG_MD5 }}

      - name: Restore or download Windows AMD64 ffmpeg bundle
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "download\windows-bin-amd64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "download\windows-amd64-ffmpeg.zip"
          $targetDir = Join-Path $env:GITHUB_WORKSPACE "target\res\bin"

          if (-not (Test-Path (Join-Path $bundleDir "ffmpeg.exe"))) {
            Remove-Item $bundleDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

            Write-Host "→ Downloading $env:WINDOWS_AMD64_FFMPEG_URL"
            curl.exe -L $env:WINDOWS_AMD64_FFMPEG_URL -o $zipPath --progress-bar
            $actualMd5 = (Get-FileHash $zipPath -Algorithm MD5).Hash.ToLowerInvariant()
            if ($actualMd5 -ne $env:WINDOWS_AMD64_FFMPEG_MD5.ToLowerInvariant()) {
              throw "Windows AMD64 ffmpeg zip MD5 mismatch: got $actualMd5 expected $env:WINDOWS_AMD64_FFMPEG_MD5"
            }
            Expand-Archive -Path $zipPath -DestinationPath $bundleDir -Force

            $inner = Join-Path $bundleDir "ffmpeg"
            if (Test-Path $inner) {
              Get-ChildItem $inner -Force | Move-Item -Destination $bundleDir -Force
              Remove-Item $inner -Recurse -Force
            }

            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "✔︎ Cached Windows AMD64 ffmpeg bundle"
          }

          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path (Join-Path $bundleDir "*") -Destination $targetDir -Recurse -Force

      - name: Restore cached sqlite3 AMD64
        id: cache-sqlite-amd64
        uses: actions/cache@v5
        with:
          path: target\res\bin\sqlite3.exe
          key: sqlite3-${{ runner.os }}-amd64-${{ env.SQLITE_VERSION }}

      - name: Build sqlite3 AMD64
        if: steps.cache-sqlite-amd64.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sqliteVersion = $env:SQLITE_VERSION
          $versionParts = $sqliteVersion.Split('.')
          if ($versionParts.Count -ne 3) {
            throw "Unexpected SQLite version format: $sqliteVersion"
          }

          $sqliteEncodedVersion = "{0}{1:D2}{2:D2}00" -f `
            [int]$versionParts[0], `
            [int]$versionParts[1], `
            [int]$versionParts[2]

          $downloadPage = Invoke-WebRequest -Uri "https://sqlite.org/download.html"
          $relativeAmalgamationUrl = [regex]::Match(
            $downloadPage.Content,
            "(?<path>\d{4}/sqlite-amalgamation-$sqliteEncodedVersion\.zip)"
          ).Groups["path"].Value
          if (-not $relativeAmalgamationUrl) {
            throw "Could not find sqlite-amalgamation-$sqliteEncodedVersion.zip on sqlite.org/download.html"
          }

          $sqliteAmalgamationUrl = "https://sqlite.org/$relativeAmalgamationUrl"
          $sqliteRoot = Join-Path $env:GITHUB_WORKSPACE "download\sqlite-amd64"
          $sqliteAmalgamationZip = Join-Path $sqliteRoot "sqlite-amalgamation.zip"
          $sqliteOutDir = Join-Path $env:GITHUB_WORKSPACE "target\res\bin"

          New-Item -ItemType Directory -Path $sqliteRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $sqliteOutDir -Force | Out-Null

          Write-Host "→ Downloading $sqliteAmalgamationUrl"
          curl.exe -L $sqliteAmalgamationUrl -o $sqliteAmalgamationZip --progress-bar

          $sqliteAmalgamationDir = Join-Path $sqliteRoot "amalgamation"
          Expand-Archive -Path $sqliteAmalgamationZip -DestinationPath $sqliteAmalgamationDir -Force

          $sqliteAmalgamationSourceDir = Get-ChildItem $sqliteAmalgamationDir -Directory | Where-Object Name -like 'sqlite-amalgamation-*' | Select-Object -First 1
          if (-not $sqliteAmalgamationSourceDir) {
            throw "Could not locate extracted SQLite amalgamation directory"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsInstallPath) {
            throw "Could not find a Visual Studio installation"
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "Could not find VsDevCmd.bat at $vsDevCmd"
          }

          $sqliteExe = Join-Path $sqliteOutDir "sqlite3.exe"
          Push-Location $sqliteAmalgamationSourceDir.FullName
          try {
            $compileCmd = @(
              "`"$vsDevCmd`" -arch=amd64 -host_arch=amd64",
              "&&",
              "cl",
              "/nologo",
              "/O2",
              "/MT",
              "/DSQLITE_THREADSAFE=1",
              "/DSQLITE_ENABLE_DBPAGE_VTAB",
              "/Fe:`"$sqliteExe`"",
              "`"$($sqliteAmalgamationSourceDir.FullName)\shell.c`"",
              "`"$($sqliteAmalgamationSourceDir.FullName)\sqlite3.c`""
            ) -join ' '
            cmd.exe /c $compileCmd
            if ($LASTEXITCODE -ne 0) {
              throw "sqlite3 AMD64 compilation failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $sqliteExe)) {
            throw "Expected sqlite3.exe at $sqliteExe"
          }

      - name: Build Windows AMD64 app
        run: mvn -B package -P windows_64bit,install4j-win-amd64 -DskipTests

      - name: Upload to S3
        env:
          S3_ENDPOINT: ${{ secrets.MVS3_ENDPOINT }}
          S3_BUCKET:   ${{ secrets.MVS3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MVS3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MVS3_SECRET_ACCESS_KEY }}
        shell: pwsh
        run: |
          $date     = Get-Date -Format yyyy-MM-dd
          $endpoint = "https://$env:S3_ENDPOINT"
          $bucket   = $env:S3_BUCKET
          $version  = $env:MV_VERSION
      
          $exeName = "MediathekView-$version-win-amd64-$date.exe"
          $zipName = "MediathekView-$version-win-amd64-$date.zip"

          # Files in target/media Directory
          ls target\media\ | Format-Table
      
          # SHA512 generieren
          Get-FileHash target\media\MediathekView-latest-windows-amd64.exe -Algorithm SHA512 | Select-Object -ExpandProperty Hash | Out-File -Encoding ASCII "target\media\$exeName.sha512"
          Get-FileHash target\media\MediathekView-latest-windows-amd64.zip -Algorithm SHA512 | Select-Object -ExpandProperty Hash | Out-File -Encoding ASCII "target\media\$zipName.sha512"
      
          # Upload update manifest xml
          aws --endpoint-url $endpoint s3 cp target\media\updates.xml "s3://$bucket/updates-win.xml"

          # Upload .exe
          aws --endpoint-url $endpoint s3 cp target\media\MediathekView-latest-windows-amd64.exe "s3://$bucket/$exeName"
          aws --endpoint-url $endpoint s3 cp "target\media\$exeName.sha512" "s3://$bucket/$exeName.sha512"
      
          # Upload .zip
          aws --endpoint-url $endpoint s3 cp target\media\MediathekView-latest-windows-amd64.zip "s3://$bucket/$zipName"
          aws --endpoint-url $endpoint s3 cp "target\media\$zipName.sha512" "s3://$bucket/$zipName.sha512"
